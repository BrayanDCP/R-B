<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.O.S.S.Y - Inicio Vendedora</title>
    
    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/components.css">
    
    <!-- SDK Oficial de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="main-content">

    <!-- Encabezado de la pantalla -->
    <header class="card" style="margin: 16px 16px 0 16px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 id="saludo-vendedora">Hola, EVELYN 👋</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Turno Mañana/Tarde</p>
        </div>
        <span class="badge badge-success" id="estado-caja">Caja Abierta</span>
    </header>

    <!-- Contenido Principal / Resumen del Día -->
    <main style="padding: 16px;">
        
        <!-- Tarjeta de Resumen de Ventas -->
        <section class="card" style="text-align: center; background: linear-gradient(135deg, #111111 0%, #1e293b 100%); color: #ffffff;">
            <p style="font-size: 0.85rem; opacity: 0.8;">Vendido Hoy</p>
            <h1 id="monto-total-hoy" style="font-size: 2.5rem; margin: 8px 0;">S/ 0.00</h1>
            <p style="font-size: 0.85rem; opacity: 0.8;"><span id="cant-ventas-hoy">0</span> ventas realizadas</p>
        </section>

        <!-- Botón de Acción Rápida -->
        <section style="margin-bottom: 20px;">
            <a href="nueva-venta.html" class="btn-primary btn-large" style="font-size: 1.1rem; gap: 8px;">
                ➕ Nueva Venta
            </a>
        </section>

        <!-- Accesos Directos Secundarios -->
        <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <a href="historial.html" class="btn-secondary" style="padding: 16px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px;">
                <span style="font-size: 1.5rem;">📋</span>
                <span>Ver Ventas</span>
            </a>
            <a href="productos.html" class="btn-secondary" style="padding: 16px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px;">
                <span style="font-size: 1.5rem;">👕</span>
                <span>Stock Tallas</span>
            </a>
        </section>

    </main>

    <!-- Menú de Navegación Inferior Móvil -->
    <nav class="mobile-nav">
        <a href="inicio.html" class="mobile-nav-item active">
            <span style="font-size: 1.2rem;">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="nueva-venta.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">🛒</span>
            <span>Vender</span>
        </a>
        <a href="historial.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">📄</span>
            <span>Ventas</span>
        </a>
        <a href="productos.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">📦</span>
            <span>Stock</span>
        </a>
        <a href="perfil.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

    <!-- Scripts del sistema -->
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
