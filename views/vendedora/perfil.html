<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&B - Perfil de Usuario</title>
    
    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/components.css">
    
    <!-- SDK Oficial de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="main-content">

    <!-- Encabezado de la pantalla -->
    <header class="card" style="margin: 16px 16px 12px 16px; padding: 16px; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 8px;">👤</div>
        <h2 style="font-size: 1.4rem;">Vendedora EVELYN</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Usuario activo: <strong style="color: var(--text-primary);">ryb</strong></p>
    </header>

    <!-- Información de sesión y opciones -->
    <main style="padding: 0 16px;">
        
        <!-- Detalle de la cuenta -->
        <section class="card" style="margin-bottom: 16px;">
            <h3 style="font-size: 1rem; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Información del Turno</h3>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem;">
                <span style="color: var(--text-secondary);">Rol:</span>
                <span style="font-weight: 600;">Atención / Ventas</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem;">
                <span style="color: var(--text-secondary);">Correo Interno:</span>
                <span style="font-weight: 600;">ryb@rossy.com</span>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                <span style="color: var(--text-secondary);">Estado de Caja:</span>
                <span class="badge badge-success">Abierta</span>
            </div>
        </section>

        <!-- Botón de Cierre de Sesión -->
        <section>
            <button type="button" onclick="logoutUser()" class="btn-primary btn-large" style="background-color: var(--error-color);">
                🚪 Cerrar Sesión
            </button>
        </section>

    </main>

    <!-- Menú de Navegación Inferior Móvil -->
    <nav class="mobile-nav">
        <a href="inicio.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="nueva-venta.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">🛒</span>
            <span>Vender</span>
        </a>
        <a href="historial.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">📄</span>
            <span>Ventas</span>
        </a>
        <a href="productos.html" class="mobile-nav-item">
            <span style="font-size: 1.2rem;">📦</span>
            <span>Stock</span>
        </a>
        <a href="perfil.html" class="mobile-nav-item active">
            <span style="font-size: 1.2rem;">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

    <!-- Scripts del sistema -->
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
